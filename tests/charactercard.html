<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Personnage Compacte</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .card {
            width: 150px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 8px;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 6px;
            object-fit: cover;
        }

        .card h2 {
            font-size: 14px;
            margin: 5px 0;
        }

        .card h3 {
            font-size: 12px;
            color: gray;
            margin-bottom: 5px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 10px;
        }

        .stat {
            font-weight: bold;
            background: #007BFF;
            color: white;
            padding: 3px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/100" alt="Image du personnage">
            <h2>Vegu</h2>
            <h3>Ultra Égo</h3>
            <div class="stats">
                <div class="stat">DPS: 4466</div>
                <div class="stat">RNG: 50</div>
                <div class="stat">Coût: 500</div>
            </div>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/100" alt="Image du personnage">
            <h2>Merlin</h2>
            <h3>Le Mage</h3>
            <div class="stats">
                <div class="stat">DPS: 3200</div>
                <div class="stat">RNG: 60</div>
                <div class="stat">Coût: 400</div>
            </div>
        </div>
    </div>

</body>
</html>
