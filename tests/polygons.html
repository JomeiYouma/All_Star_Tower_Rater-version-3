<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Buttons</title>
    <style>
        @keyframes pulse {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                border-width: 2px;
            }
            100% {
                transform: scale(2) rotate(0deg);
                opacity: 0;
                border-width: 4px;
            }
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 150px;
        }

        .btn-container {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            position: relative;
            padding: 15px 30px;
            font-size: 18px;
            color: #fff;
            text-transform: uppercase;
            border: 2px /* solid */ cyan;
            cursor: pointer;
            background: none;
            outline: none;
            font-family: 'Press Start 2P', cursive;
            z-index: 2;
        }

        .waves {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid cyan;
            background: none; /* Supprime le remplissage */
            box-shadow: 0 0 10px cyan; /* Ajoute un effet néon */
            transform: scale(1);
            opacity: 0;
            animation: pulse 2s infinite;
        }

        .wave:nth-child(2) {
            animation-delay: 0.5s;
        }

        .wave:nth-child(3) {
            animation-delay: 1s;
        }

        /* Shapes for each button */
        .btn-container:nth-child(1) .wave {
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%); /* Square */
        }
        .btn-container:nth-child(2) .wave {
            clip-path: polygon(50% 0%, 100% 80%, 0% 80%); /* Adjusted Triangle */
        }
        .btn-container:nth-child(3) .wave {
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        }
    </style>
</head>
<body>
    <div class="btn-container">
        <button class="btn">Start</button>
        <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
    <div class="btn-container">
        <button class="btn">Options</button>
        <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
    <div class="btn-container">
        <button class="btn">Quit</button>
        <div class="waves">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
    </div>
</body>
</html>
